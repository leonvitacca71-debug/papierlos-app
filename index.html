:0 4px 12px #376b4d55}.empty{color:#7c877f;text-align:center;padding:22px}.overlay{position:fixed;inset:0;background:#112b2180;z-index:5;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fafbf7;border-radius:26px 26px 0 0;width:min(100%,700px);max-height:90dvh;overflow:auto;padding:25px 22px calc(env(safe-area-inset-bottom) + 24px)}label{display:block;font-weight:650;font-size:13px;margin:15px 0 7px}input,select{width:100%;padding:13px;border-radius:12px;border:1px solid #d8e2d7;background:white;color:#213e33}input[type=checkbox]{width:auto} .hide{display:none!important}.note{font-size:12px;color:#849086;margin-top:12px}.error{color:#b34b42}.done{opacity:.55;text-decoration:line-through}@media(max-width:400px){h1{font-size:31px}.tile{padding:12px 8px}.tag{font-size:11px}}
 .file-button{display:block;text-align:center;border:1px dashed #8caa91;background:#edf4e9;border-radius:15px;padding:17px;margin-top:12px;color:#315b44;font-weight:650}.file-button input{display:none}.filehint{font-size:12px;color:#66776d;margin-top:7px}.preview{max-width:100%;max-height:65vh;object-fit:contain;border-radius:12px}.doc-actions{display:flex;gap:8px;align-items:center}.small-btn{border:0;background:#e5ecdf;color:#315b44;border-radius:12px;padding:9px 11px}.danger{color:#a34b45} </style></head><body><main><div class="top"><span class="pill" id="taskCount">🌿 0 offene Aufgaben ›</span><span class="spark">✧</span></div><div id="screen"></div></main><nav class="nav"><button data-page="home" class="active"><span class="ico">⌂</span>Start</button><button data-page="docs"><span class="ico">▤</span>Dokumente</button><button id="addBtn"><span class="add">+</span>Hinzufügen</button><button data-page="calendar"><span class="ico">▦</span>Kalender</button></nav><div id="modal" class="hide"></div><script>
const KEY='papierlos_v01'; const now=new Date();const iso=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};const shift=n=>{let d=new Date();d.setDate(d.getDate()+n);return iso(d)};const demo={docs:[{id:'d1',name:'Stromrechnung',sender:'Stadtwerke (Beispiel)',category:'Strom',date:shift(-3)},{id:'d2',name:'Versicherungsvertrag',sender:'Versicherung (Beispiel)',category:'Versicherung',date:shift(-8)}],tasks:[{id:'t1',name:'Stromrechnung prüfen',sender:'Stadtwerke (Beispiel)',amount:128.47,date:shift(3),type:'Zahlung',done:false},{id:'t2',name:'Vertrag kündigen oder verlängern',sender:'Versicherung (Beispiel)',amount:0,date:shift(14),type:'Frist',done:false}]};let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(demo)}catch{data=structuredClone(demo)};data=(data&&typeof data==='object')?data:{};data.docs=Array.isArray(data.docs)?data.docs:[];data.tasks=Array.isArray(data.tasks)?data.tasks:[];let page='home',category='Alle',search='',month=new Date(now.getFullYear(),now.getMonth(),1);const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const euro=n=>Number(n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});const fmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('de-DE'):'Kein Datum';const days=s=>Math.round((new Date(s+'T12:00:00')-new Date(iso(new Date())+'T12:00:00'))/86400000);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const active=()=>data.tasks.filter(t=>t&&!t.done).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));const taskRow=t=>`<div class="item"><div class="round">${t.type==='Zahlung'?'◈':'▦'}</div><div class="detail"><div class="name ${t.done?'done':''}">${esc(t.name)}</div><div class="sub">${esc(t.sender||t.type)} · ${fmt(t.date)}</div>${Number(t.amount)>0?`<div class="price">${euro(t.amount)}</div>`:''}</div><span class="tag ${days(t.date)<0?'late':days(t.date)<7?'warn':''}">${days(t.date)<0?'Überfällig':days(t.date)===0?'Heute':`in ${days(t.date)} Tagen`}</span><button class="link" data-done="${esc(t.id)}" title="Erledigt">${t.done?'↺':'✓'}</button></div>`;const docRow=d=>`<div class="item"><div class="round">▤</div><div class="detail"><div class="name">${esc(d.name)}</div><div class="sub">${esc(d.sender||'Dokument')} · ${fmt(d.date)}</div></div><span class="tag">${esc(d.category)}</span><div class="doc-actions"><button class="small-btn" data-open="${esc(d.id)}" title="Dokument öffnen">Öffnen</button><button class="link danger" data-delete="${esc(d.id)}" title="Löschen">×</button></div></div>`;const section=(title,content)=>`<div class="section-title"><h2>${title}</h2></div><div class="card">${content||'<div class="empty">Hier ist noch nichts eingetragen.</div>'}</div>`;
function render(){try{renderPage()}catch(error){showAppError(error)}}function renderPage(){document.getElementById('taskCount').textContent=`🌿 ${active().length} offene Aufgaben ›`;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let html='';if(page==='home'){const tasks=active(),pays=tasks.filter(t=>t.type==='Zahlung'),dead=tasks.filter(t=>t.type==='Frist'),first=tasks[0];html=`<h1>Heute erledigen</h1><p>${data.docs.length} Dokumente · ${pays.length} Zahlungen · ${dead.length} Fristen</p><div class="card hero">${first?`<div class="hero-row"><div class="round">▤</div><div><div class="eyebrow">NÄCHSTE AUFGABE</div><h2 style="margin:8px 0">${esc(first.name)}</h2><p>${esc(first.sender||'')}</p><div class="amount">${Number(first.amount)>0?euro(first.amount):'Frist'}</div><div class="muted">fällig am ${fmt(first.date)}</div></div></div><div style="text-align:right;margin-top:15px"><button class="btn" data-done="${esc(first.id)}">Als erledigt markieren →</button></div>`:'<h2>Alles erledigt! 🌿</h2><p>Keine offenen Aufgaben.</p>'}</div><div class="tiles"><div class="card tile"><div class="round">◈</div><strong>Offene Zahlungen</strong><div class="value">${euro(pays.reduce((s,t)=>s+Number(t.amount||0),0))}</div></div><div class="card tile"><div class="round">▦</div><strong>Anstehende Fristen</strong><div class="value">${dead.length}</div></div><div class="card tile"><div class="round">▤</div><strong>Dokumente</strong><div class="value">${data.docs.length}</div></div></div>${section('Deine offenen Zahlungen',pays.map(taskRow).join(''))}${section('Anstehende Fristen',dead.map(taskRow).join(''))}`}
if(page==='docs'){const cats=['Alle','Strom','Handy','Versicherung','Behörden','Wohnen','Sonstiges'];const docs=data.docs.filter(d=>(category==='Alle'||d.category===category)&&[d.name,d.sender,d.category].join(' ').toLowerCase().includes(search.toLowerCase()));html=`<h1>Dokumente</h1><p>Alle deine Briefe, Verträge und Rechnungen an einem Ort.</p><input id="search" class="search" placeholder="Dokumente oder Absender suchen …" value="${esc(search)}"><div class="chips">${cats.map(c=>`<button class="chip ${c===category?'active':''}" data-cat="${c}">${c}</button>`).join('')}</div><div class="banner"><strong>Papierchaos war gestern.</strong><p>Ordne deine Unterlagen übersichtlich ein.</p></div>${section('Neueste Dokumente',docs.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(docRow).join(''))}<p class="note">Version 0.2: Fotos und PDFs werden lokal auf diesem Gerät gespeichert. Nur Testdokumente verwenden; keine sichere Cloud-Sicherung.</p>`}
if(page==='calendar'){let ds=Array.from({length:7},(_,i)=>{let d=new Date(month);d.setDate(d.getDate()+i+Math.max(0,now.getDate()-3));return d});const monthly=active().filter(t=>t.date.slice(0,7)===iso(month).slice(0,7));html=`<h1>Kalender</h1><p>Alle Fristen und Zahlungen auf einen Blick</p><div class="card" style="margin-top:22px"><div class="flex"><button class="link" id="prev">❮</button><strong>${month.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</strong><button class="link" id="next">❯</button></div><div class="week">${ds.map(d=>`<div class="day ${iso(d)===iso(now)?'active':''}"><small>${d.toLocaleDateString('de-DE',{weekday:'short'})}</small>${d.getDate()}</div>`).join('')}</div></div>${section('Termine in diesem Monat',monthly.map(taskRow).join(''))}${section('Alle kommenden Termine',active().map(taskRow).join(''))}`}document.getElementById('screen').innerHTML=html;const input=document.getElementById('search');if(input)input.addEventListener('input',e=>{search=e.target.value;let pos=e.target.selectionStart;render();let n=document.getElementById('search');n.focus();n.setSelectionRange(pos,pos)});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;render()});document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{let t=data.tasks.find(x=>x.id===b.dataset.done);if(t){t.done=!t.done;save();render()}});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDoc(b.dataset.open));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('Dokumenteintrag und zugehörige Datei wirklich löschen?')){await removeAttachment(b.dataset.delete);data.docs=data.docs.filter(d=>d.id!==b.dataset.delete);save();render()}});if(document.getElementById('prev'))document.getElementById('prev').onclick=()=>{month.setMonth(month.getMonth()-1);render()};if(document.getElementById('next'))document.getElementById('next').onclick=()=>{month.setMonth(month.getMonth()+1);render()}}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();scrollTo(0,0)});function modal(){const m=document.getElementById('modal');m.className='overlay';m.innerHTML=`<div class="sheet"><div class="flex"><h2 style="margin:0">Hinzufügen</h2><button class="link" id="close">Schließen ×</button></div><div class="chips" style="margin-top:18px"><button class="chip active" id="chooseDoc">Dokument</button><button class="chip" id="chooseTask">Zahlung / Frist</button></div><form id="entry"><label>Bezeichnung</label><input name="name" placeholder="z. B. Stromrechnung" required maxlength="100"><label>Absender / Anbieter</label><input name="sender" placeholder="z. B. Stadtwerke" maxlength="100"><div id="docFields"><label>Foto oder PDF (optional)</label><label class="file-button">📷 Foto aufnehmen oder Datei auswählen<input id="attachment" type="file" accept="image/*,application/pdf"></label><div class="filehint" id="fileInfo">Bis 15 MB · Speicherung nur auf diesem iPhone</div><label>Kategorie</label><select name="category"><option>Strom</option><option>Handy</option><option>Versicherung</option><option>Behörden</option><option>Wohnen</option><option>Sonstiges</option></select></div><div id="taskFields" class="hide"><label>Art</label><select name="type"><option>Zahlung</option><option>Frist</option></select><label>Betrag in € (optional)</label><input name="amount" type="number" min="0" step="0.01" placeholder="0,00"></div><label id="dateLabel">Dokumentdatum</label><input name="date" type="date" value="${iso(now)}" required><button class="btn" style="margin-top:22px;width:100%">Speichern</button></form><p class="note">Lokale Testversion: Fotos und PDFs bleiben auf diesem Gerät. Keine Cloud, keine KI, keine Datensicherung. Keine vertraulichen Originaldokumente verwenden.</p></div>`;let mode='doc';document.getElementById('close').onclick=()=>m.className='hide';m.onclick=e=>{if(e.target===m)m.className='hide'};function switchMode(x){mode=x;document.getElementById('docFields').classList.toggle('hide',x!=='doc');document.getElementById('taskFields').classList.toggle('hide',x==='doc');document.getElementById('chooseDoc').classList.toggle('active',x==='doc');document.getElementById('chooseTask').classList.toggle('active',x!=='doc');document.getElementById('dateLabel').textContent=x==='doc'?'Dokumentdatum':'Fälligkeitsdatum'}document.getElementById('chooseDoc').onclick=()=>switchMode('doc');document.getElementById('chooseTask').onclick=()=>switchMode('task');document.getElementById('attachment').onchange=e=>{let f=e.target.files[0];document.getElementById('fileInfo').textContent=f?`${f.name} · ${(f.size/1048576).toFixed(1)} MB`:'Keine Datei ausgewählt'};document.getElementById('entry').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);const id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString());if(mode==='doc'){let attachment=document.getElementById('attachment').files[0];if(attachment){if(attachment.size>15*1024*1024){alert('Datei ist größer als 15 MB.');return}if(!['application/pdf'].includes(attachment.type)&&!attachment.type.startsWith('image/')){alert('Bitte ein Foto oder eine PDF auswählen.');return}try{await storeAttachment(id,attachment)}catch(err){alert('Datei konnte nicht gespeichert werden. Bitte freien Speicher prüfen. '+err.message);return}}data.docs.push({id,name:f.get('name'),sender:f.get('sender'),category:f.get('category'),date:f.get('date'),hasFile:!!attachment});page='docs'}else{data.tasks.push({id,name:f.get('name'),sender:f.get('sender'),type:f.get('type'),amount:Number(f.get('amount')||0),date:f.get('date'),done:false});page='home'}save();m.className='hide';render()}}document.getElementById('addBtn').onclick=modal;try{render()}catch(error){showAppError(error)}if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

// Dateien getrennt von bestehenden Metadaten in IndexedDB speichern.
const DB_NAME='papierlos_attachments_v02';
function dbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbOperation(mode,method,key,value){const db=await dbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction('files',mode),store=tx.objectStore('files');let req=method==='put'?store.put(value,key):store[method](key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close();tx.onerror=()=>reject(tx.error)})}
async function storeAttachment(id,file){return dbOperation('readwrite','put',id,file)}
async function getAttachment(id){return dbOperation('readonly','get',id)}
async function removeAttachment(id){return dbOperation('readwrite','delete',id)}
async function openDoc(id){
 const d=data.docs.find(x=>x.id===id);if(!d)return;
 const m=document.getElementById('modal');m.className='overlay';
 m.innerHTML=`<div class="sheet"><div class="flex"><h2 style="margin:0">${esc(d.name)}</h2><button class="link" id="closePreview">Schließen ×</button></div><p style="margin-top:8px">${esc(d.sender||'')} · ${fmt(d.date)}</p><div id="previewArea" style="margin-top:20px">Datei wird geladen …</div></div>`;
 document.getElementById('closePreview').onclick=()=>m.className='hide';
 m.onclick=e=>{if(e.target===m)m.className='hide'};
 try{const file=await getAttachment(id),area=document.getElementById('previewArea');if(!file){area.innerHTML='<p>Für diesen Eintrag ist keine Datei hinterlegt.</p>';return}
 const url=URL.createObjectURL(file);const isPdf=file.type==='application/pdf';
 area.innerHTML=isPdf?`<p>PDF: ${esc(file.name)}</p><a class="btn" id="fileLink" target="_blank" rel="noopener">PDF öffnen</a>`:`<img class="preview" alt="Dokumentvorschau" id="previewImg"><p class="note">Das Foto ist lokal auf diesem Gerät gespeichert.</p>`;
 if(isPdf)document.getElementById('fileLink').href=url;else document.getElementById('previewImg').src=url;
 }catch(err){document.getElementById('previewArea').textContent='Datei konnte nicht geladen werden: '+err.message}
}
function showAppError(error){const screen=document.getElementById('screen');if(!screen)return;screen.innerHTML='<div class="card" style="margin-top:30px"><h2>Ein Fehler ist aufgetreten</h2><p>Deine gespeicherten Einträge wurden nicht gelöscht.</p><p id="errorDetail" style="overflow-wrap:anywhere;margin-top:12px;color:#9b3f37"></p><button class="btn" id="retryRender" style="margin-top:15px">Erneut versuchen</button></div>';document.getElementById('errorDetail').textContent=String(error&&error.message||error);document.getElementById('retryRender').onclick=()=>render();}
window.addEventListener('error',e=>showAppError(e.error||e.message));window.addEventListener('unhandledrejection',e=>showAppError(e.reason));
</script></body></html>
