nts.name.value=info.name;if(info.sender)form.elements.sender.value=info.sender;if(info.date)form.elements.date.value=info.date;if(info.category)form.elements.category.value=info.category;result.textContent=`Vorschlag: ${info.name||'—'} · ${info.date?fmt(info.date):'Datum offen'}${info.amount?' · '+euro(info.amount):''}. Bitte Angaben prüfen.`;if(info.amount){result.textContent+=' Zahlung übernehmen?';const b=document.createElement('button');b.type='button';b.className='btn secondary';b.textContent='Zahlung / Frist anlegen';b.onclick=()=>{switchMode('task');form.elements.name.value=info.name||'Rechnung';form.elements.sender.value=info.sender||'';form.elements.date.value=info.date||iso(now);form.elements.amount.value=info.amount};document.getElementById('smartPayButton')?.remove();b.id='smartPayButton';result.after(b)}}catch(err){result.textContent='Erkennung nicht verfügbar: '+err.message}};document.getElementById('entry').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);const id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString());if(mode==='doc'){let attachment=document.getElementById('attachment').files[0];if(attachment){if(attachment.size>15*1024*1024){alert('Datei ist größer als 15 MB.');return}if(!['application/pdf'].includes(attachment.type)&&!attachment.type.startsWith('image/')){alert('Bitte ein Foto oder eine PDF auswählen.');return}try{await storeAttachment(id,attachment);const verified=await getAttachment(id);if(!verified||verified.size!==attachment.size)throw new Error('Kontrolle fehlgeschlagen: gespeicherte Datei nicht vollständig gefunden')}catch(err){alert('Datei konnte nicht gespeichert werden. Bitte freien Speicher prüfen. '+err.message);return}}data.docs.push({id,name:f.get('name'),sender:f.get('sender'),category:f.get('category'),date:f.get('date'),hasFile:!!attachment});page='docs'}else{data.tasks.push({id,name:f.get('name'),sender:f.get('sender'),type:f.get('type'),amount:Number(f.get('amount')||0),date:f.get('date'),d // Dateien getrennt von bestehenden Metadaten in IndexedDB speichern.
const DB_NAME='papierlos_attachments_v02';
function dbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbOperation(mode,method,key,value){const db=await dbOpen();return new Promise((resolve,reject)=>{let result,settled=false;const tx=db.transaction('files',mode),store=tx.objectStore('files');const req=method==='put'?store.put(value,key):store[method](key);req.onsuccess=()=>{result=req.result};tx.oncomplete=()=>{db.close();if(!settled){settled=true;resolve(result)}};tx.onabort=tx.onerror=()=>{if(!settled){settled=true;db.close();reject(tx.error||new Error('Datenbanktransaktion abgebrochen'))}};req.onerror=()=>{ /* transaction abort handler rejects */ }})}
async function storeAttachment(id,file){return dbOperation('readwrite','put',id,file)}
async function getAttachment(id){return dbOperation('readonly','get',id)}
async function removeAttachment(id){return dbOperation('readwrite','delete',id)}
async function openDoc(id){
 const d=data.docs.find(x=>x.id===id);if(!d)return;
 const m=document.getElementById('modal');m.className='overlay';
 m.innerHTML=`<div class="sheet"><div class="preview-head"><h2>${esc(d.name)}</h2><p class="preview-meta">${d.sender?esc(d.sender)+' · ':''}${fmt(d.date)}</p><div class="preview-actions"><button class="link" id="editPreview">Bearbeiten ✎</button><button class="link" id="closePreview">Schließen ×</button></div></div><div id="previewArea">Datei wird geladen …</div></div>`;
 document.getElementById('closePreview').onclick=()=>m.className='hide';document.getElementById('editPreview').onclick=()=>editDoc(id);
 m.onclick=e=>{if(e.target===m)m.className='hide'};

 const url=URL.createObjectURL(file);const isPdf=file.type==='application/pdf';

 }catch(err){document.getElementById('previewArea').textContent='Datei konnte nicht geladen werden: '+err.message}
}
function editDoc(id){
 const d=data.docs.find(x=>x.id===id);if(!d)return;
 const m=document.getElementById('modal');m.className='overlay';

 if(d.category&&!categories.includes(d.category))categories.unshift(d.category);

 document.getElementById('closeEdit').onclick=()=>m.className='hide';
 m.onclick=e=>{if(e.target===m)m.className='hide'};
 document.getElementById('editEntry').onsubmit=e=>{e.preventDefault();const form=new FormData(e.currentTarget);const newName=String(form.get('name')||'').trim();if(!newName){alert('Bitte eine Bezeichnung eingeben.');return}
 const updated={...d,name:newName,sender:String(form.get('sender')||'').trim(),category:String(form.get('category')||'Sonstiges'),date:String(form.get('date')||'')};

}

function recognize(text){
 const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean),lower=text.toLowerCase();
 const dateMatches=[...text.matchAll(/(?:fällig(?:keit)?|zahlbar bis|bis zum|zahlungstermin|frist)\s*[:\-]?\s*(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/gi)];
 const generic=[...text.matchAll(/\b(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})\b/g)];
 const dt=(dateMatches[0]||generic[0]);let date='';if(dt){const d=new Date(+dt[3],+dt[2]-1,+dt[1]);if(d.getDate()===+dt[1]&&d.getMonth()===+dt[2]-1)date=iso(d)}
 const amountMatches=[...text.matchAll(/(?:gesamtbetrag|rechnungsbetrag|zu zahlen|betrag|summe|gesamt)\s*[:\s]*([\d.]+,\d{2})\s*€?/gi)];
 const genericAmount=[...text.matchAll(/([\d.]+,\d{2})\s*€/g)];const a=(amountMatches[0]||genericAmount[0]);const amount=a?Number(a[1].replace(/\./g,'').replace(',','.')):0;
 const category=/strom|energie|elektrizit/i.test(lower)?'Strom':/mobilfunk|telefon|telekom|handy/i.test(lower)?'Handy':/versicherung|police/i.test(lower)?'Versicherung':/miete|wohnung|hausgeld/i.test(lower)?'Wohnen':/finanzamt|behörde|stadtverwaltung/i.test(lower)?'Behörden':'Sonstiges';
 const sender=lines.find(x=>/^(?:absender|anbieter|von)\s*:/i.test(x))?.replace(/^[^:]*:\s*/,'')||lines.find(x=>/^(?:stadtwerke|telekom|vodafone|o2|allianz|huk|axa|enbw|badenova|amazon|paypal|deutsche post|finanzamt)\b/i.test(x))||((lines[0]&&!/^(rechnung|mahnung|vertrag|bescheid|kündigung|datum|gesamtbetrag)/i.test(lines[0]))?lines[0]:'');
 const rawName=lines.find(x=>/rechnung|mahnung|kündigung|vertrag|bescheid|beitragsrechnung/i.test(x))?.slice(0,100)||lines[0]?.slice(0,100)||'';const name=(category==='Strom'&&/rechnung/i.test(rawName)?'Stromrechnung':rawName)+(sender&&category==='Strom'?' – '+sender:'');
 return {name,sender,date,amount,category};
}
async function extractFileText(file){
 if(file.type==='application/pdf'){
  if(!window.pdfjsLib){await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';sc.onload=resolve;sc.onerror=()=>reject(new Error('PDF-Texterkennung benötigt Internet'));document.head.append(sc)})}
  const bytes=await file.arrayBuffer(),pdf=await pdfjsLib.getDocument({data:bytes,disableFontFace:true}).promise;let text='';for(let i=1;i<=Math.min(pdf.numPages,5);i++){const page=await pdf.getPage(i);const content=await page.getTextContent();text+=content.items.map(x=>x.str).join(' ')+'\n'}return text;
 }
 if(file.type.startsWith('image/')&&'TextDetector' in window){const detector=new TextDetector();const bitmap=await createImageBitmap(file);try{return (await detector.detect(bitmap)).map(x=>x.rawValue).join('\n')}finally{bitmap.close()}}
 throw new Error('Foto-OCR wird in dieser lokalen Web-App nicht zuverlässig unterstützt. Bitte Text einfügen oder eine textbasierte PDF wählen.');
}
function editTask(id){const t=data.tasks.find(x=>x.id===id);if(!t)return;const m=document.getElementById('modal');m.className='overlay';m.innerHTML=`<div class="sheet"><div class="flex"><h2 style="margin:0">Termin bearbeiten</h2><button class="link" id="closeTask">Schließen ×</button></div><form id="taskForm"><label>Bezeichnung</label><input name="name" required maxlength="100" value="${esc(t.name)}"><label>Absender</label><input name="sender" maxlength="100" value="${esc(t.sender||'')}"><label>Art</label><select name="type"><option ${t.type==='Zahlung'?'selected':''}>Zahlung</option><option ${t.type==='Frist'?'selected':''}>Frist</option></select><label>Betrag (€)</label><input name="amount" type="number" min="0" step="0.01" value="${Number(t.amount)||0}"><label>Datum</label><input name="date" type="date" required value="${esc(t.date)}"><label>Wiederholung</label><select name="repeat"><option value="">Einmalig</option><option value="monthly" ${t.repeat==='monthly'?'selected':''}>Monatlich</option><option value="yearly" ${t.repeat==='yearly'?'selected':''}>Jährlich</option></select><button class="btn" style="width:100%;margin-top:20px">Speichern</button></form><button class="link danger" id="deleteTask" style="margin-top:18px">Termin löschen</button></div>`;document.getElementById('closeTask').onclick=()=>m.className='hide';document.getElementById('deleteTask').onclick=()=>{if(confirm('Termin löschen?')){data.tasks=data.tasks.filter(x=>x.id!==id);save();m.className='hide';render()}};document.getElementById('taskForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);Object.assign(t,{name:f.get('name'),sender:f.get('sender'),type:f.get('type'),amount:Number(f.get('amount')||0),date:f.get('date'),repeat:f.get('repeat')});try{save();m.className='hide';render()}catch(err){alert('Speichern fehlgeschlagen: '+err.message)}}}

/* Settings, full-data backup, offline-friendly calendar export. Existing storage keys stay unchanged. */
function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file)})}
function dataURLtoBlob(str){const [head,body]=str.split(',');if(!head||!body)throw new Error('Ungültiger Anhang');const mime=(head.match(/data:([^;]+)/)||[])[1]||'application/octet-stream';const raw=atob(body);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new Blob([bytes],{type:mime})}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
async function exportBackup(){const button=document.getElementById('backupExport');button.disabled=true;button.textContent='Backup wird erstellt …';try{const attachments={};for(const d of data.docs){if(d.hasFile){const f=await getAttachment(d.id);if(f)attachments[d.id]={name:f.name||d.name,type:f.type,data:await fileToDataURL(f)}}}const payload={format:'PAPIERLOS_BACKUP',version:1,createdAt:new Date().toISOString(),data,attachments};downloadBlob(new Blob([JSON.stringify(payload)],{type:'application/json'}),'PAPIERLOS-Backup-'+iso(new Date())+'.json');document.getElementById('backupStatus').textContent='Backup erstellt. Bitte in Dateien an einem sicheren Ort aufbewahren.'}catch(err){document.getElementById('backupStatus').textContent='Backup fehlgeschlagen: '+err.message}finally{button.disabled=false;button.textContent='Vollständiges Backup exportieren'}}
async function importBackup(file){if(!file)return;const status=document.getElementById('backupStatus');try{const text=await file.text();if(text.length>100*1024*1024)throw new Error('Backup zu groß');const payload=JSON.parse(text);if(payload.format!=='PAPIERLOS_BACKUP'||payload.version!==1||!Array.isArray(payload.data?.docs)||!Array.isArray(payload.data?.tasks)||typeof payload.attachments!=='object')throw new Error('Keine gültige PAPIERLOS-Backupdatei');if(!confirm('Backup wiederherstellen? Bestehende Einträge werden ersetzt. Bitte vorher selbst ein Backup exportieren.'))return;const docs=payload.data.docs,tasks=payload.data.tasks;if(docs.length>10000||tasks.length>20000)throw new Error('Zu viele Einträge');for(const d of docs){if(typeof d.id!=='string'||typeof d.name!=='string')throw new Error('Ungültiger Dokumenteintrag');const item=payload.attachments[d.id];if(item){const blob=dataURLtoBlob(item.data);if(blob.size>15*1024*1024)throw new Error('Anhang zu groß');const f=new File([blob],String(item.name||d.name),{type:item.type||blob.type});await storeAttachment(d.id,f)}}const restored={...payload.data,docs,tasks};localStorage.setItem(KEY,JSON.stringify(restored));data=restored;status.textContent='Wiederherstellung erfolgreich. Dokumente und Termine sind verfügbar.';render()}catch(err){status.textContent='Import fehlgeschlagen: '+err.message}}
function exportCalendar(){const escapeIcs=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,'\\$&');const events=data.tasks.filter(t=>/^\d{4}-\d{2}-\d{2}$/.test(t.date||'')).map(t=>{const start=t.date.replaceAll('-','');const next=new Date(t.date+'T12:00:00');next.setDate(next.getDate()+1);return ['BEGIN:VEVENT','UID:'+String(t.id).replace(/[^a-zA-Z0-9-]/g,'')+'@papierlos','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'').replace('Z','Z'),'DTSTART;VALUE=DATE:'+start,'DTEND;VALUE=DATE:'+iso(next).replaceAll('-',''),'SUMMARY:'+escapeIcs(t.name),'DESCRIPTION:'+escapeIcs((t.sender||'')+(t.amount?' · '+euro(t.amount):'')),'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:Papierlos Erinnerung','END:VALARM','END:VEVENT'].join('\r\n')});const content=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PAPIERLOS//DE','CALSCALE:GREGORIAN',...events,'END:VCALENDAR'].join('\r\n');downloadBlob(new Blob([content],{type:'text/calendar;charset=utf-8'}),'PAPIERLOS-Termine.ics')}
function showSettings(){const m=document.getElementById('modal');m.className='overlay';m.innerHTML=`<div class="sheet"><div class="flex"><h2 style="margin:0">Einstellungen & Sicherung</h2><button class="link" id="closeSettings">Schließen ×</button></div><p style="margin:12px 0 20px">Deine Daten bleiben in dieser App auf deinem Gerät. Erstelle regelmäßig eine Sicherung.</p><div class="settings-stats"><div><strong>${data.docs.length}</strong>Dokumente</div><div><strong>${data.tasks.length}</strong>Termine</div></div><h2>Datensicherung</h2><div class="backup-actions"><button class="btn" id="backupExport">Vollständiges Backup exportieren</button><label class="file-button">Backup wiederherstellen<input type="file" id="backupImport" accept=".json,application/json"></label><button class="btn secondary" id="calendarExport">Termine als Kalenderdatei (.ics)</button></div><p id="backupStatus" class="note" role="status"></p><h2>Datenschutz</h2><div class="notice">Diese Web-App verwendet lokale Speicherung, aber keine Verschlüsselung, keine Cloud-Synchronisierung und keine verifizierte automatische Datensicherung. Ein Export enthält deine Dokumente unverschlüsselt. Bitte sicher aufbewahren. Kalendererinnerungen werden erst nach Import der ICS-Datei in eine Kalender-App eingerichtet.</div><p class="note">PAPIERLOS Release 1.0 · Installierbare Web-App · Kein App-Store-Release · Keine vollwertige Cloud-KI</p></div>`;document.getElementById('closeSettings').onclick=()=>m.className='hide';m.onclick=e=>{if(e.target===m)m.className='hide'};document.getElementById('backupExport').onclick=exportBackup;document.getElementById('backupImport').onchange=e=>importBackup(e.target.files[0]);document.getElementById('calendarExport').onclick=exportCalendar}
